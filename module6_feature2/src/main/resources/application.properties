spring.application.name=module6_feature2

# Postgres started via `docker compose up -d` (see docker-compose.yml in this module's folder)
spring.datasource.url=jdbc:postgresql://localhost:5432/module6_feature2db
spring.datasource.username=postgres
spring.datasource.password=postgres

# ddl-auto=update lets Hibernate create/evolve tables from the entities as we iterate
# on the catalog in class. Not something you'd use against a real production database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# TLS (carried over from module3; see docs/module3/rest/README.md#tls-and-basic-auth). Self-signed,
# dev-only certificate committed at src/main/resources/keystore.p12, generated with:
#   keytool -genkeypair -alias cs600 -keyalg RSA -keysize 2048 -storetype PKCS12 \
#     -keystore keystore.p12 -validity 3650 -storepass changeit \
#     -dname "CN=localhost, OU=CS600, O=SNHU, L=Manchester, ST=NH, C=US"
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=cs600

# Seed credentials for the one user DefaultUserSeeder creates in the `users` table on first
# startup, so the login screen and the REST API's HTTP Basic auth both work out of the box with
# the same student/changeit credentials used since Module 3. Dev-only, same spirit as the
# Postgres credentials above — every other user from here on is a real row in `users`, not a
# property in this file.
app.security.username=student
app.security.password=changeit
