spring.application.name=cs600

# Postgres started via `docker compose up -d` (see docker-compose.yml at the repo root)
spring.datasource.url=jdbc:postgresql://localhost:5432/cs600db
spring.datasource.username=postgres
spring.datasource.password=postgres

# ddl-auto=update lets Hibernate create/evolve tables from the entities as we iterate
# on the catalog in class. Not something you'd use against a real production database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
