spring.application.name=vaadin_example

# UI-only reference project: no database, no Spring Security. TLS is still enabled (carried over
# from module3/module5; see docs/module3/rest/README.md#tls-and-basic-auth) because some browsers
# — Safari in particular — refuse to persist the session cookie Vaadin's server-driven UI depends
# on when the app is served over plain HTTP. Self-signed, dev-only certificate committed at
# src/main/resources/keystore.p12, generated with:
#   keytool -genkeypair -alias cs600 -keyalg RSA -keysize 2048 -storetype PKCS12 \
#     -keystore keystore.p12 -validity 3650 -storepass changeit \
#     -dname "CN=localhost, OU=CS600, O=SNHU, L=Manchester, ST=NH, C=US"
server.port=8090
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=cs600
